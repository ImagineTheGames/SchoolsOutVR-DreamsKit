; Dreams Creator Kit - engine settings.
; The renderer settings mirror School's Out VR's Quest renderer (the game's Config/DefaultEngine.ini), so what
; you see in the editor is close to what a player sees on a Quest: forward shading, MSAA, no static lighting,
; no Nanite, no virtual textures, no decals (DBuffer), no sky atmosphere, no auto exposure or bloom.
; Editor frame rate is NOT a Quest pass - see Docs/06-performance-on-quest.md.

